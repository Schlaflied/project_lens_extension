<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="sidebar.css">
</head>
<body>
    <div class="sidebar-layout">
        <!-- Main Content Area -->
        <div class="content-wrapper">
            <div id="top-panel" class="top-panel">
                <section class="panel input-panel">
                    <div>
                        <header class="header">
                            <div class="logo" id="logo" data-key="logo_text"></div>
                        </header>
                        <h1 data-key="title"></h1>
                        <p class="subtitle" data-key="subtitle"></p>
                        
                        <div class="form-group">
                            <label for="smart-paste-box" data-key="smart_paste_label"></label>
                            <textarea id="smart-paste-box" rows="5" data-key-placeholder="smart_paste_placeholder"></textarea>
                        </div>
                        
                        <div class="form-group">
                            <label data-key="aspects_label"></label>
                            <!-- 【核心升级】Aspect tags will be dynamically generated here -->
                            <div class="aspect-tags" id="aspect-tags"></div>
                        </div>

                        <div class="form-group">
                            <label for="resume-text" data-key="resume_label"></label>
                            <textarea id="resume-text" rows="4" data-key-placeholder="resume_placeholder"></textarea>
                        </div>
                    </div>
                    
                    <button class="analyze-button" id="analyze-button">
                        <span data-key="button_text"></span>
                    </button>
                </section>
            </div>

            <div class="resizer" id="resizer"></div>

            <section class="panel output-panel">
                <div id="result-container"></div>
                <div class="sources-container" id="sources-container"></div>
            </section>
        </div>

        <!-- Toolbar -->
        <div class="actions-bar">
            <button class="action-button" id="collapse-button" title="收起">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="11 17 6 12 11 7"></polyline><polyline points="18 17 13 12 18 7"></polyline></svg>
            </button>
            <a href="https://buymeacoffee.com/200203sytty" target="_blank" class="action-button" data-key-title="support_text" title="请开发者喝杯咖啡">☕️</a>
            <button class="action-button" id="theme-switcher" data-key-title="theme_switcher_title" title="切换模式">☀️</button>
            <div class="lang-toggle-vertical" id="lang-toggle">
                <button class="lang-button" data-lang="zh-CN" title="简体中文">简</button>
                <button class="lang-button" data-lang="zh-TW" title="繁體中文">繁</button>
                <button class="lang-button" data-lang="en" title="English">EN</button>
            </div>
        </div>
    </div>

    <script src="lib/marked.min.js"></script>
    <script src="lib/purify.min.js"></script>
    <script src="sidebar.js"></script>
</body>
</html>
